<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNS風メモアプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- ヘッダー -->
        <header class="header">
            <h1>📝 メモタイム</h1>
            <p>あなたの思いを共有しよう</p>
        </header>

        <!-- メイン コンテンツ -->
        <main class="main">
            <!-- 投稿フォーム -->
            <section class="post-form">
                <div class="user-info">
                    <div class="avatar">👤</div>
                    <div class="form-group">
                        <input 
                            type="text" 
                            id="usernameInput" 
                            placeholder="お名前を入力..." 
                            class="username-input"
                        >
                        <textarea 
                            id="memoInput" 
                            placeholder="何かメモに残したいことはありますか？"
                            class="memo-textarea"
                            rows="4"
                        ></textarea>
                        <button id="postBtn" class="post-btn">投稿する</button>
                    </div>
                </div>
            </section>

            <!-- ツールバー -->
            <section class="toolbar">
                <button id="sortBtn" class="sort-btn">⬇️ 新しい順</button>
                <button id="clearAllBtn" class="clear-all-btn">🗑️ すべて削除</button>
            </section>

            <!-- タイムライン -->
            <section class="timeline" id="timeline">
                <div class="empty-state">
                    <p>📭 まだメモがありません</p>
                    <p>最初のメモを投稿してみましょう！</p>
                </div>
            </section>
        </main>

        <!-- フッター -->
        <footer class="footer">
            <p>&copy; 2026 SNS風メモアプリ | Made with ❤️</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
